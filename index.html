<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Chatroom</title>

    <style>
        /* =========================================================
   BASE / RESET
   ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;

            font-family: "Lucida Grande", Helvetica, Arial, sans-serif;
            font-size: 13px;

            color: #000;
            background: #d9d9d9;

            -webkit-text-size-adjust: 100%;
        }

        a {
            color: #06c;
            cursor: pointer;
            text-decoration: underline;
        }

        .clear {
            clear: both;
        }

        button,
        input,
        textarea,
        select {
            font-family: "Lucida Grande", Helvetica, Arial, sans-serif;
            font-size: 13px;
        }

        button {
            cursor: pointer;
        }

        input[type="checkbox"] {
            -webkit-appearance: checkbox;
        }


        /* =========================================================
   APP SHELL
   ========================================================= */

        #app {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;

            max-width: 760px;
            margin: 0 auto;

            background: #fff;

            border-left: 1px solid #999;
            border-right: 1px solid #999;

            overflow: hidden;
        }


        /* =========================================================
   HEADER
   ========================================================= */

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 40px;

            border-bottom: 1px solid #777;

            background-color: #e5e5e5;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#f8f8f8),
                    color-stop(48%, #e7e7e7),
                    color-stop(52%, #d9d9d9),
                    to(#c7c7c7));

            background: -webkit-linear-gradient(top,
                    #f8f8f8,
                    #e7e7e7 48%,
                    #d9d9d9 52%,
                    #c7c7c7);

            background: linear-gradient(to bottom,
                    #f8f8f8,
                    #e7e7e7 48%,
                    #d9d9d9 52%,
                    #c7c7c7);
        }

        #backBtn {
            display: none;

            position: absolute;
            left: 8px;
            top: 7px;
        }

        #header .title {
            display: block;

            text-align: center;
            font-weight: bold;
            font-size: 14px;
            line-height: 40px;

            padding: 0 90px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            text-shadow: 0 1px 0 #fff;
        }

        #header .actions {
            position: absolute;
            right: 8px;
            top: 7px;
        }

        #header .actions label {
            font-size: 11px;
            vertical-align: middle;
        }


        /* =========================================================
   PAGES
   ========================================================= */

        .page {
            position: absolute;

            top: 40px;
            left: 0;
            right: 0;
            bottom: 0;

            padding: 16px 14px;

            overflow: auto;

            background: #fff;
        }

        .page h2 {
            margin: 0 0 12px 0;
            font-size: 18px;

            text-shadow: 0 1px 0 #fff;
        }

        .page p {
            font-size: 11px;
            color: #555;
        }


        /* =========================================================
   FORMS
   ========================================================= */

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            color: #000;
        }

        input[type="text"],
        input[type="password"] {
            -webkit-appearance: textfield;

            width: 100%;
            max-width: 280px;

            margin-bottom: 10px;
        }


        /* =========================================================
   CHAT
   ========================================================= */

        #chat {
            display: none;

            position: absolute;

            top: 40px;
            left: 0;
            right: 0;
            bottom: 0;
        }


        /* =========================================================
   CONVERSATION LIST
   ========================================================= */

        #list {
            position: absolute;

            top: 0;
            left: 0;
            bottom: 0;

            width: 220px;

            border-right: 1px solid #aaa;

            background: #eef0f3;

            overflow: auto;
        }

        .listhead {
            padding: 6px 12px;

            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;

            color: #7a7a7a;

            text-shadow: 0 1px 0 #fff;

            border-bottom: 1px solid #cdcfd3;

            background: #dfe2e6;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#e9ebef),
                    to(#d7dade));

            background: -webkit-linear-gradient(top,
                    #e9ebef,
                    #d7dade);

            background: linear-gradient(to bottom,
                    #e9ebef,
                    #d7dade);
        }

        .conv {
            padding: 9px 12px;

            border-bottom: 1px solid #dcdee2;

            cursor: pointer;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .conv:hover {
            background: #e4e7eb;
        }

        .conv.active {
            color: #fff;

            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.3);

            background: #3d80e0;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#5e9bf0),
                    to(#2f6fd6));

            background: -webkit-linear-gradient(top,
                    #5e9bf0,
                    #2f6fd6);

            background: linear-gradient(to bottom,
                    #5e9bf0,
                    #2f6fd6);
        }

        .conv .sub {
            display: block;

            font-size: 10px;
            color: #999;

            text-shadow: none;
        }

        .conv.active .sub {
            color: #d8e6ff;
        }

        .addfriend {
            padding: 10px 12px;

            border-top: 1px solid #cdcfd3;

            background: #e4e6ea;
        }

        .addfriend input {
            width: 100%;
            max-width: none;

            margin-bottom: 6px;
        }


        /* =========================================================
   THREAD
   ========================================================= */

        #thread {
            position: absolute;

            top: 0;
            left: 220px;
            right: 0;
            bottom: 0;
        }


        /* =========================================================
   MESSAGES
   ========================================================= */

        #messages {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 84px;

            overflow: auto;

            -webkit-overflow-scrolling: touch;

            padding: 8px 10px;

            background: #f7f7f7;
        }


        /* =========================================================
   COMPOSER
   ========================================================= */

        #composer {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 84px;

            padding: 8px 10px;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            border-top: 1px solid #fff;

            background: #e9e9e9;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#f2f2f2),
                    to(#dcdcdc));

            background: -webkit-linear-gradient(top,
                    #f2f2f2,
                    #dcdcdc);

            background: linear-gradient(to bottom,
                    #f2f2f2,
                    #dcdcdc);

            -webkit-box-shadow:
                inset 0 1px 0 #fff,
                0 -1px 2px rgba(0, 0, 0, 0.12);

            box-shadow:
                inset 0 1px 0 #fff,
                0 -1px 2px rgba(0, 0, 0, 0.12);
        }

        #composer #message {
            -webkit-appearance: textfield;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            width: 100%;

            font-size: 13px;

            margin-bottom: 6px;
        }


        /* =========================================================
   MESSAGE ROWS
   ========================================================= */

        .row {
            margin: 7px 0;

            clear: both;

            width: 100%;

            overflow: hidden;
        }

        .row.right {
            text-align: right;
        }

        .row.left {
            text-align: left;
        }

        .name {
            font-size: 11px;

            color: #888;

            margin: 0 4px 1px 4px;

            text-shadow: 0 1px 0 #fff;
        }

        .messageLine {
            display: inline-block;

            max-width: 90%;

            vertical-align: bottom;
        }

        .profileButton {
            display: inline-block;

            vertical-align: bottom;

            width: 36px;
            height: 36px;

            padding: 0;

            margin: 0 7px 2px 0;

            border: 0;

            background: transparent;

            cursor: pointer;
        }

        .row.right .profileButton {
            margin: 0 0 2px 7px;
        }

        .profileButton img,
        .avatarFallback {
            display: block;

            width: 32px;
            height: 32px;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            border-radius: 50%;

            border: 1px solid rgba(0, 0, 0, 0.25);

            object-fit: cover;

            background: #ddd;
        }

        .avatarFallback {
            line-height: 30px;

            text-align: center;

            font-weight: bold;

            color: #555;

            text-shadow: 0 1px 0 #fff;
        }

        .messageContent {
            display: inline-block;

            vertical-align: bottom;

            max-width: calc(100% - 45px);

            text-align: left;
        }

        .row.right .messageContent {
            text-align: right;
        }
        .profileBio {
            position: relative;

            margin: 8px 0;

            width: 100%;

            overflow: hidden;

            word-wrap: break-word;
        }


        /* =========================================================
   SKEUO MESSAGE BUBBLES
   ========================================================= */

        .bubble {
            display: inline-block;

            max-width: 78%;

            padding: 6px 10px;

            text-align: left;

            line-height: 18px;

            white-space: pre-wrap;
            word-wrap: break-word;

            border-radius: 12px;

            border: 1px solid rgba(0, 0, 0, 0.18);

            -webkit-box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.65),
                0 1px 2px rgba(0, 0, 0, 0.18);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.65),
                0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .bubble.left {
            color: #000;

            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.8);

            background: #e7e7e7;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#fafafa),
                    color-stop(48%, #e9e9e9),
                    to(#d5d5d5));

            background: -webkit-linear-gradient(top,
                    #fafafa,
                    #e9e9e9 48%,
                    #d5d5d5);

            background: linear-gradient(to bottom,
                    #fafafa,
                    #e9e9e9 48%,
                    #d5d5d5);
        }

        .bubble.right {
            color: #fff;

            border-color: #1766b5;

            text-shadow:
                0 -1px 0 rgba(0, 0, 0, 0.25);

            background: #3d8fe8;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#6fb4f5),
                    color-stop(48%, #398fe8),
                    to(#1975d1));

            background: -webkit-linear-gradient(top,
                    #6fb4f5,
                    #398fe8 48%,
                    #1975d1);

            background: linear-gradient(to bottom,
                    #6fb4f5,
                    #398fe8 48%,
                    #1975d1);
        }


        /* =========================================================
   PROFILE CARD
   ========================================================= */

        .profileCard {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 360px;
            max-width: 90%;
            max-height: 90%;

            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);

            z-index: 1000;

            background: #f2f2f2;

            border: 1px solid #777;

            border-radius: 8px;

            -webkit-box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.35);

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.35);

            overflow: hidden;
        }

        .profileBanner {
            position: relative;

            width: 100%;
            height: 120px;

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            background-color: #d5d5d5;
        }

        .profileBody {
            position: relative;

            text-align: left;

            min-height: 150px;

            padding: 58px 20px 20px 20px;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            background: transparent;

            z-index: 1;
        }

        .profileBody .profileAvatar,
        .profileAvatar {
            position: absolute;

            left: 20px;
            top: -50px;

            width: 96px;
            height: 96px;

            border-radius: 50%;

            object-fit: cover;

            background: #ddd;

            border: 5px solid #fff;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            -webkit-box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.35);

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.35);

            z-index: 10;
        }

        .profileBody h2 {
            margin: 0 0 4px 0;

            font-size: 18px;
            line-height: 22px;

            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .profileBody p {
            margin: 4px 0;

            line-height: 17px;
        }

        .profileCard.profileColored .profileBody {
            background: transparent;
        }


        /* =========================================================
   SETTINGS
   ========================================================= */

        .settingsPanel {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 360px;
            max-width: 90%;
            max-height: 90%;

            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);

            z-index: 1000;

            background: #f2f2f2;

            border: 1px solid #777;

            -webkit-box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.35);

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.35);

            padding: 12px;

            overflow: auto;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        .settingsPanel label {
            display: block;

            margin: 8px 0;
        }

        .settingsPanel input,
        .settingsPanel textarea,
        .settingsPanel select {
            max-width: 100%;

            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        .settingsProfileUploads {
            margin-top: 14px;

            padding-top: 10px;

            border-top: 1px solid #bbb;
        }

        .settingsSectionTitle {
            font-weight: bold;

            margin: 10px 0 5px 0;

            text-shadow:
                0 1px 0 #fff;
        }

        .settingsUploadRow {
            margin-bottom: 4px;
        }

        .settingsUploadRow input[type="file"] {
            width: 100%;
            max-width: 100%;

            margin-bottom: 6px;
        }

        .settingsUploadRow button {
            margin-right: 5px;
        }

        .settingsUploadStatus {
            min-height: 16px;

            margin-bottom: 8px;

            font-size: 11px;

            color: #666;
        }


        /* =========================================================
   TYPING
   ========================================================= */

        #typingIndicator {
            height: 18px;

            padding-left: 10px;

            font-size: 11px;
            line-height: 18px;

            opacity: 0.55;

            color: #555;

            overflow: hidden;
        }


        /* =========================================================
   =========================================================
   THEME: LIGHT SKEUO
   =========================================================
   ========================================================= */

        html.theme-light-skeuo {
            background: #d9d9d9;
            color: #000;
        }


        /* =========================================================
   THEME: DARK SKEUO
   ========================================================= */

        html.theme-dark-skeuo,
        html.theme-dark-skeuo body {
            background: #101114;
            color: #f4f4f4;
        }

        html.theme-dark-skeuo #app {
            background: #17191c;
            border-color: #30343a;
        }

        html.theme-dark-skeuo #header {
            color: #fff;

            border-color: #090a0c;

            background: #292c30;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#3b3e43),
                    color-stop(48%, #2d3034),
                    color-stop(52%, #22252a),
                    to(#181a1e));

            background: -webkit-linear-gradient(top,
                    #3b3e43,
                    #2d3034 48%,
                    #22252a 52%,
                    #181a1e);

            background: linear-gradient(to bottom,
                    #3b3e43,
                    #2d3034 48%,
                    #22252a 52%,
                    #181a1e);
        }

        html.theme-dark-skeuo #header .title {
            color: #fff;
            text-shadow: 0 -1px 0 #000;
        }

        html.theme-dark-skeuo #header button {
            color: #fff;
            background: #30343a;
            border-color: #111317;
        }

        html.theme-dark-skeuo .page {
            background: #17191c;
            color: #f4f4f4;
        }

        html.theme-dark-skeuo .page h2 {
            color: #fff;
            text-shadow: 0 -1px 0 #000;
        }

        html.theme-dark-skeuo .page p {
            color: #bfc3c8;
        }

        html.theme-dark-skeuo #list {
            background: #1c1f23;
            border-color: #090a0c;
        }

        html.theme-dark-skeuo .listhead {
            color: #bfc3c8;
            text-shadow: 0 -1px 0 #000;

            border-color: #0c0e11;

            background: #292c31;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#34373c),
                    to(#23262a));

            background: -webkit-linear-gradient(top,
                    #34373c,
                    #23262a);

            background: linear-gradient(to bottom,
                    #34373c,
                    #23262a);
        }

        html.theme-dark-skeuo .conv {
            background: #1c1f23;

            color: #eee;

            border-color: #0d0f12;

            text-shadow: 0 -1px 0 #000;
        }

        html.theme-dark-skeuo .conv:hover {
            background: #292d32;
        }

        html.theme-dark-skeuo .conv .sub {
            color: #8f969e;
        }

        html.theme-dark-skeuo .conv.active {
            color: #fff;

            background: #285d9d;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#397ac2),
                    to(#204e8a));

            background: -webkit-linear-gradient(top,
                    #397ac2,
                    #204e8a);

            background: linear-gradient(to bottom,
                    #397ac2,
                    #204e8a);
        }

        html.theme-dark-skeuo .addfriend {
            background: #202328;
            border-color: #0b0d10;
        }

        html.theme-dark-skeuo #thread {
            background: #111316;
        }

        html.theme-dark-skeuo #messages {
            background: #111316;
        }

        html.theme-dark-skeuo #composer {
            background: #202328;

            border-color: #08090b;

            -webkit-box-shadow:
                inset 0 1px 0 #34383d,
                0 -1px 2px rgba(0, 0, 0, 0.5);

            box-shadow:
                inset 0 1px 0 #34383d,
                0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        html.theme-dark-skeuo input,
        html.theme-dark-skeuo textarea,
        html.theme-dark-skeuo select {
            background: #24272b;
            color: #fff;
            border-color: #090b0e;
        }

        html.theme-dark-skeuo input::placeholder,
        html.theme-dark-skeuo textarea::placeholder {
            color: #888;
        }

        html.theme-dark-skeuo button {
            background: #292d32;
            color: #fff;
            border-color: #0c0e11;
        }

        html.theme-dark-skeuo button:hover {
            background: #343941;
        }


        /* DARK SKEUO INCOMING BUBBLE */

        html.theme-dark-skeuo .bubble.left {
            color: #fff;

            text-shadow:
                0 -1px 0 rgba(0, 0, 0, 0.7);

            border-color: #090b0e;

            background: #363a40;

            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#474c53),
                    color-stop(48%, #3b4047),
                    to(#2b2f35));

            background: -webkit-linear-gradient(top,
                    #474c53,
                    #3b4047 48%,
                    #2b2f35);

            background: linear-gradient(to bottom,
                    #474c53,
                    #3b4047 48%,
                    #2b2f35);

            -webkit-box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.55);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.55);
        }


        /* BLUE OUTGOING BUBBLE STAYS BLUE */

        html.theme-dark-skeuo .bubble.right {
            color: #fff;
        }


        /* DARK SKEUO PROFILES */

        html.theme-dark-skeuo .profileCard,
        html.theme-dark-skeuo .settingsPanel {
            background: #202328;
            color: #fff;

            border-color: #080a0d;

            -webkit-box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.65);

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.65);
        }

        html.theme-dark-skeuo .profileBody h2,
        html.theme-dark-skeuo .settingsPanel h2,
        html.theme-dark-skeuo .settingsPanel h3 {
            color: #fff;
            text-shadow: 0 -1px 0 #000;
        }

        html.theme-dark-skeuo .profileBody p,
        html.theme-dark-skeuo .settingsPanel label,
        html.theme-dark-skeuo .settingsPanel strong {
            color: #ddd;
        }

        html.theme-dark-skeuo .profileAvatar {
            border-color: #202328;
        }

        html.theme-dark-skeuo .settingsProfileUploads {
            border-color: #3a3e44;
        }

        html.theme-dark-skeuo .settingsSectionTitle {
            color: #fff;
            text-shadow: 0 -1px 0 #000;
        }

        html.theme-dark-skeuo #typingIndicator {
            color: #aaa;
        }


        /* =========================================================
   THEME: LIGHT BASIC
   ========================================================= */

        html.theme-light-basic,
        html.theme-light-basic body {
            background: #f4f4f4;
            color: #111;
        }

        html.theme-light-basic #app {
            background: #fff;
            border-color: #ccc;
        }

        html.theme-light-basic #header,
        html.theme-light-basic #composer {
            background: #eee;
            border-color: #ccc;

            -webkit-box-shadow: none;
            box-shadow: none;
        }

        html.theme-light-basic #list {
            background: #f5f5f5;
            border-color: #ccc;
        }

        html.theme-light-basic .listhead {
            background: #e9e9e9;
            border-color: #ccc;
            text-shadow: none;
        }

        html.theme-light-basic .conv {
            background: #f5f5f5;
            border-color: #ddd;
            text-shadow: none;
        }

        html.theme-light-basic .conv:hover {
            background: #e8e8e8;
        }

        html.theme-light-basic #messages,
        html.theme-light-basic #thread {
            background: #fff;
        }

        html.theme-light-basic .bubble.left {
            background: #e6e6e6;
            color: #111;
            text-shadow: none;
            border-color: #ccc;

            -webkit-box-shadow: none;
            box-shadow: none;
        }

        html.theme-light-basic .bubble.right {
            background: #398fe8;
            color: #fff;

            -webkit-box-shadow: none;
            box-shadow: none;
        }


        /* =========================================================

    <script>

        var THEME_KEY = "chat_theme";
        var BACKGROUND_KEY = "chat_theme_background";

        /*
         * Themes that use modern CSS features such as:
         * backdrop-filter, transparency, CSS variables, etc.
         */
        var MODERN_THEMES = {
            "modern-light": true,
            "modern-dark": true
        };


        /* =========================================================
           OLD / LEGACY BROWSER DETECTION
           ========================================================= */

        function isOldBrowser() {

            var ua = navigator.userAgent || "";
            var appVersion = navigator.appVersion || "";

            /*
             * Internet Explorer
             */
            if (
                ua.indexOf("MSIE ") !== -1 ||
                ua.indexOf("Trident/") !== -1
            ) {
                return true;
            }


            /*
             * Old iOS Safari / iOS WebKit
             *
             * iOS 9 and below = definitely old
             */
            var iosMatch = ua.match(/OS (\d+)[._](\d+)/);

            if (
                /iPhone|iPad|iPod/.test(ua) &&
                iosMatch
            ) {

                var iosMajor =
                    parseInt(iosMatch[1], 10);

                if (iosMajor < 10) {
                    return true;
                }
            }


            /*
             * Old macOS versions.
             *
             * OS X 10.6, 10.7, 10.8, etc.
             */
            var macMatch =
                ua.match(/Mac OS X (\d+)[._](\d+)(?:[._](\d+))?/);

            if (macMatch) {

                var macMajor =
                    parseInt(macMatch[1], 10);

                var macMinor =
                    parseInt(macMatch[2], 10);

                /*
                 * 10.6, 10.7 and 10.8 are considered legacy.
                 */
                if (
                    macMajor === 10 &&
                    macMinor <= 8
                ) {
                    return true;
                }
            }


            /*
             * Old Safari.
             *
             * Safari user agents contain:
             *
             * Version/5.0 Safari/...
             * Version/6.0 Safari/...
             *
             * Safari 8 and below are treated as legacy.
             */
            var safariMatch =
                ua.match(/Version\/(\d+)(?:\.(\d+))?.*Safari\//);

            if (safariMatch) {

                var safariMajor =
                    parseInt(safariMatch[1], 10);

                if (safariMajor < 9) {
                    return true;
                }
            }


            /*
             * Old Android WebKit browsers.
             */
            var androidMatch =
                ua.match(/Android (\d+)(?:\.(\d+))?/);

            if (androidMatch) {

                var androidMajor =
                    parseInt(androidMatch[1], 10);

                if (androidMajor < 5) {
                    return true;
                }
            }


            /*
             * Old Chrome.
             */
            var chromeMatch =
                ua.match(/Chrome\/(\d+)/);

            if (chromeMatch) {

                var chromeMajor =
                    parseInt(chromeMatch[1], 10);

                if (chromeMajor < 60) {
                    return true;
                }
            }


            /*
             * Old Firefox.
             */
            var firefoxMatch =
                ua.match(/Firefox\/(\d+)/);

            if (firefoxMatch) {

                var firefoxMajor =
                    parseInt(firefoxMatch[1], 10);

                if (firefoxMajor < 55) {
                    return true;
                }
            }


            /*
             * Very old WebKit.
             */
            var webkitMatch =
                ua.match(/AppleWebKit\/(\d+)/);

            if (webkitMatch) {

                var webkitMajor =
                    parseInt(webkitMatch[1], 10);

                if (webkitMajor < 600) {
                    return true;
                }
            }


            return false;
        }


        /* =========================================================
           APPLY THEME
           ========================================================= */

        function applyTheme(theme, skipWarning) {

            var root = document.documentElement;

            var themeClass = "theme-" + theme;

            var oldClasses = [
                "theme-light-skeuo",
                "theme-dark-skeuo",
                "theme-light-basic",
                "theme-dark-basic",
                "theme-pink-skeuo",
                "theme-modern-light",
                "theme-modern-dark",
                "theme-dark",
                "theme-light"
            ];

            var i;

            /* =====================================================
               OLD BROWSER WARNING
               ===================================================== */

            if (
                MODERN_THEMES[theme] &&
                isOldBrowser() &&
                !skipWarning
            ) {

                var confirmed = window.confirm(
                    "This theme is designed for modern browsers.\n\n" +
                    "Your browser appears to be an older browser " +
                    "and may not support some of the effects used " +
                    "by this theme, such as transparency, blur, " +
                    "and modern CSS.\n\n" +
                    "Are you sure you want to apply this theme?"
                );

                if (!confirmed) {

                    var previous = null;

                    try {
                        previous = localStorage.getItem(THEME_KEY);
                    } catch (e) { }

                    if (previous && previous !== theme) {

                        applyTheme(previous, true);

                    } else {

                        applyTheme("light-skeuo", true);

                    }

                    return false;
                }
            }


            /* =====================================================
               REMOVE ONLY OLD THEME CLASSES
               ===================================================== */

            var classes = root.className
                .replace(/^\s+|\s+$/g, "")
                .split(/\s+/);

            var newClasses = [];

            for (i = 0; i < classes.length; i++) {

                if (!classes[i]) {
                    continue;
                }

                var isThemeClass = false;

                for (var j = 0; j < oldClasses.length; j++) {

                    if (classes[i] === oldClasses[j]) {
                        isThemeClass = true;
                        break;
                    }
                }

                if (!isThemeClass) {
                    newClasses.push(classes[i]);
                }
            }

            newClasses.push(themeClass);

            root.className = newClasses.join(" ");


            /* =====================================================
               SAVE THEME
               ===================================================== */

            try {
                localStorage.setItem(
                    THEME_KEY,
                    theme
                );
            } catch (e) { }


            /* =====================================================
               UPDATE THEME SELECTOR
               ===================================================== */

            var selector =
                document.getElementById("settingTheme");

            if (selector) {
                selector.value = theme;
            }


            /* =====================================================
               BACKGROUND CONTROLS
               ===================================================== */

            updateBackgroundControls(theme);

            return true;
        }


        /* =========================================================
           THEME SELECTOR
           ========================================================= */

        function changeTheme(theme) {

            applyTheme(
                theme,
                false
            );
        }


        /* =========================================================
           BACKGROUND IMAGE
           ========================================================= */

        function saveThemeBackground() {

            var input =
                document.getElementById(
                    "themeBackgroundURL"
                );


            if (!input) {
                return;
            }


            var url =
                input.value;


            try {

                localStorage.setItem(
                    BACKGROUND_KEY,
                    url
                );

            } catch (e) { }


            setThemeBackground(url);
        }


        function setThemeBackground(url) {

            if (!url) {

                document.documentElement.style
                    .removeProperty(
                        "--theme-background-image"
                    );

                return;
            }


            /*
             * Escape characters that could
             * break the CSS url().
             */
            var safeURL =
                String(url)
                    .replace(/\\/g, "\\\\")
                    .replace(/"/g, '\\"');


            document.documentElement.style
                .setProperty(
                    "--theme-background-image",
                    'url("' + safeURL + '")'
                );
        }


        /* =========================================================
           BACKGROUND SETTINGS VISIBILITY
           ========================================================= */

        function updateBackgroundControls(theme) {

            var box =
                document.getElementById(
                    "customBackgroundSettings"
                );


            if (!box) {
                return;
            }


            if (
                theme === "modern-light" ||
                theme === "modern-dark"
            ) {

                box.style.display = "block";

            } else {

                box.style.display = "none";
            }
        }


        /* =========================================================
           LOAD THEME
           ========================================================= */

        function loadTheme() {

            var theme =
                "light-skeuo";

            var background =
                "";


            try {

                theme =
                    localStorage.getItem(
                        THEME_KEY
                    ) || "light-skeuo";


                background =
                    localStorage.getItem(
                        BACKGROUND_KEY
                    ) || "";

            } catch (e) { }


            /*
             * Don't show the confirmation dialog
             * while loading the saved theme.
             */
            applyTheme(
                theme,
                true
            );


            if (background) {

                setThemeBackground(
                    background
                );


                var input =
                    document.getElementById(
                        "themeBackgroundURL"
                    );


                if (input) {

                    input.value =
                        background;
                }
            }
        }


        /* =========================================================
           START
           ========================================================= */

        if (document.addEventListener) {

            document.addEventListener(
                "DOMContentLoaded",
                loadTheme
            );

        } else {

            window.attachEvent(
                "onload",
                loadTheme
            );
        }

    </script>

                    }
                    parts = [];
                    for (key in value) if (Object.prototype.hasOwnProperty.call(value, key)) parts.push(window.JSON.stringify(key) + ":" + window.JSON.stringify(value[key]));
                    return "{" + parts.join(",") + "}";
                }
            };
        }

        /* active conversation: { type: "public" } or { type: "dm", user: "someName" } */

        /* ---------- DM notifications ---------- */

        var notifiedDMs = {};
        var notificationHistoryLoaded = false;
        var notificationInitialScan = false;

        function showNotification(title, options) {

            if (!window.Notification) {
                return false;
            }

            if (Notification.permission != "granted") {
                return false;
            }

            try {

                var n = new Notification(
                    title,
                    options
                );

                return true;

            } catch (e) {

                /*
                 * Don't silently hide the error.
                 * This makes debugging much easier.
                 */
                if (window.console && console.log) {
                    console.log(
                        "Notification failed:",
                        e
                    );
                }

                return false;
            }
        }


        function getDMMessageID(message) {

            /*
             * Prefer the server's message ID.
             */
            if (message.id) {
                return "" + message.id;
            }

            /*
             * Fallback for older messages that don't
             * have an ID.
             */
            return (
                (message.from || "") +
                "|" +
                (message.text || "") +
                "|" +
                (message.time || "")
            );
        }


        function notifyNewDM(message) {

            if (!message) {
                return;
            }

            /*
             * Never notify ourselves.
             */
            if (
                message.from &&
                message.from == currentUser
            ) {
                return;
            }

            /*
             * Don't notify while the user is actively
             * looking at that DM.
             */
            if (
                active.type == "dm" &&
                active.user == message.from &&
                !document.hidden
            ) {
                return;
            }

            var id =
                getDMMessageID(message);

            if (notifiedDMs[id]) {
                return;
            }

            /*
             * Mark it before creating the notification
             * so polling cannot create duplicates.
             */
            notifiedDMs[id] = true;

            var text =
                message.text ||
                "Sent you a file";

            showNotification(
                message.from || "New message",
                {
                    body: text,
                    tag: "dm-" + id
                }
            );
        }

        /* ---------- XHR helper ---------- */

        /*
         * All requests go through the Python API on your PC.
         * withCredentials is important because login creates
         * a session cookie on the API.
         */
        function apiRequest(method, path, callback) {
            var xhr = new XMLHttpRequest();

            xhr.open(method, API + path, true);

            xhr.withCredentials = true;

            callback(xhr);

            return xhr;
        }

        function updateNotificationSettings() {

            var status =
                document.getElementById(
                    "notificationStatus"
                );

            var button =
                document.getElementById(
                    "notificationButton"
                );

            if (!window.Notification) {

                status.innerHTML =
                    "This browser does not support desktop notifications.";

                button.style.display =
                    "none";

                return;
            }

            var permission =
                Notification.permission;

            if (permission == "granted") {

                status.innerHTML =
                    "Notifications are enabled.";

                button.innerHTML =
                    "Notifications Enabled";

                button.disabled =
                    true;

            } else if (permission == "denied") {

                status.innerHTML =
                    "Notifications are blocked. Allow them in your browser's site settings.";

                button.innerHTML =
                    "Notifications Blocked";

                button.disabled =
                    true;

            } else {

                status.innerHTML =
                    "Notifications have not been enabled yet.";

                button.innerHTML =
                    "Enable Notifications";

                button.disabled =
                    false;
            }
        }


        function requestNotifications() {

            if (!window.Notification) {

                alert(
                    "This browser does not support desktop notifications."
                );

                return;
            }

            if (
                Notification.permission ==
                "granted"
            ) {

                updateNotificationSettings();

                /*
                 * Send a test notification.
                 */
                showNotification(
                    "Notifications enabled",
                    {
                        body:
                            "You will now receive notifications for new messages."
                    }
                );

                return;
            }

            if (
                Notification.permission ==
                "denied"
            ) {

                alert(
                    "Notifications are blocked for this website. " +
                    "Allow notifications in your browser's site settings."
                );

                updateNotificationSettings();

                return;
            }

            /*
             * IMPORTANT:
             *
             * This function is called directly by the
             * "Enable Notifications" button.
             *
             * That means the browser considers this a
             * user gesture and is allowed to show the
             * permission prompt.
             */
            try {

                var result =
                    Notification.requestPermission(
                        function (permission) {

                            updateNotificationSettings();

                            if (
                                permission ==
                                "granted"
                            ) {

                                showNotification(
                                    "Notifications enabled",
                                    {
                                        body:
                                            "You will now receive notifications for new messages."
                                    }
                                );
                            }
                        }
                    );

                /*
                 * Modern browsers return a Promise.
                 */
                if (
                    result &&
                    typeof result.then ==
                    "function"
                ) {

                    result.then(
                        function (permission) {

                            updateNotificationSettings();

                            if (
                                permission ==
                                "granted"
                            ) {

                                showNotification(
                                    "Notifications enabled",
                                    {
                                        body:
                                            "You will now receive notifications for new messages."
                                    }
                                );
                            }
                        }
                    );
                }

            } catch (e) {

                if (window.console && console.log) {
                    console.log(
                        "Notification permission error:",
                        e
                    );
                }

                alert(
                    "Could not request notification permission."
                );
            }
        }

        function checkDMNotifications() {

            if (!currentUser)
                return;

            if (!friends || friends.length == 0)
                return;


            /*
             * INITIAL HISTORY SCAN
             *
             * Load all existing messages first.
             *
             * Nothing that existed before this scan
             * finishes will generate a notification.
             */
            if (!notificationHistoryLoaded) {

                /*
                 * Prevent starting multiple initial
                 * scans simultaneously.
                 */
                if (notificationInitialScan)
                    return;

                notificationInitialScan = true;

                var pending =
                    friends.length;

                if (pending == 0) {

                    notificationHistoryLoaded = true;
                    notificationInitialScan = false;

                    return;
                }

                for (
                    var i = 0;
                    i < friends.length;
                    i++
                ) {

                    (function (username) {

                        var xhr = apiRequest(
                            "GET",
                            "/dm?user=" +
                            encodeURIComponent(username),

                            function (xhr) {

                                xhr.onreadystatechange =
                                    function () {

                                        if (
                                            xhr.readyState != 4
                                        )
                                            return;

                                        /*
                                         * Even if one friend's request
                                         * fails, allow initialization
                                         * to eventually finish.
                                         */
                                        if (
                                            xhr.status == 200
                                        ) {

                                            var msgs = [];

                                            try {

                                                msgs =
                                                    JSON.parse(
                                                        xhr.responseText
                                                    );

                                            } catch (e) {

                                                msgs = [];
                                            }

                                            /*
                                             * Mark every message currently
                                             * existing as already seen.
                                             */
                                            for (
                                                var j = 0;
                                                j < msgs.length;
                                                j++
                                            ) {

                                                var msg =
                                                    msgs[j];

                                                var id =
                                                    getDMMessageID(
                                                        msg
                                                    );

                                                notifiedDMs[id] =
                                                    true;
                                            }
                                        }

                                        pending--;

                                        if (
                                            pending <= 0
                                        ) {

                                            notificationHistoryLoaded =
                                                true;

                                            notificationInitialScan =
                                                false;
                                        }
                                    };
                            }
                        );

                        xhr.send();

                    })(friends[i]);
                }

                return;
            }


            /*
             * NORMAL POLLING
             *
             * At this point every message that existed
             * when we logged in has been marked as seen.
             */
            for (
                var i = 0;
                i < friends.length;
                i++
            ) {

                (function (username) {

                    var xhr = apiRequest(
                        "GET",
                        "/dm?user=" +
                        encodeURIComponent(username),

                        function (xhr) {

                            xhr.onreadystatechange =
                                function () {

                                    if (
                                        xhr.readyState != 4
                                    )
                                        return;

                                    if (
                                        xhr.status != 200
                                    )
                                        return;

                                    var msgs;

                                    try {

                                        msgs =
                                            JSON.parse(
                                                xhr.responseText
                                            );

                                    } catch (e) {

                                        return;
                                    }

                                    for (
                                        var j = 0;
                                        j < msgs.length;
                                        j++
                                    ) {

                                        var msg =
                                            msgs[j];

                                        /*
                                         * Don't notify about our
                                         * own messages.
                                         */
                                        if (
                                            msg.from ==
                                            currentUser
                                        ) {
                                            continue;
                                        }

                                        var id =
                                            getDMMessageID(
                                                msg
                                            );

                                        /*
                                         * Already seen?
                                         */
                                        if (
                                            notifiedDMs[id]
                                        ) {
                                            continue;
                                        }

                                        /*
                                         * New message.
                                         */
                                        notifyNewDM(msg);
                                    }
                                };
                        }
                    );

                    xhr.send();

                })(friends[i]);
            }
        }

        /* ---------- sending ---------- */

        function sendMessage() {

            var msg =
                trimMessage(
                    document.getElementById(
                        "message"
                    ).value
                );

            if (msg == "")
                return;


            /* ---------- DM ---------- */

            if (active.type == "dm") {

                var xhr = apiRequest(
                    "POST",
                    "/dm/send",
                    function (xhr) {

                        xhr.setRequestHeader(
                            "Content-Type",
                            "application/json"
                        );

                        xhr.onreadystatechange =
                            function () {

                                if (
                                    xhr.readyState != 4
                                )
                                    return;

                                if (
                                    xhr.status == 200
                                ) {

                                    document.getElementById(
                                        "message"
                                    ).value = "";

                                    refreshChat();

                                } else if (
                                    xhr.status == 403
                                ) {

                                    alert(
                                        "You can only message friends."
                                    );
                                }
                            };
                    }
                );

                /*
                 * The server gets "from" from the
                 * authenticated session.
                 */
                xhr.send(JSON.stringify({

                    to: active.user,

                    text: msg
                }));

                return;
            }


            /* ---------- PUBLIC CHAT ---------- */

            var xhr2 = apiRequest(
                "POST",
                "/send",
                function (xhr) {

                    xhr.setRequestHeader(
                        "Content-Type",
                        "application/json"
                    );

                    xhr.onreadystatechange =
                        function () {

                            if (
                                xhr.readyState != 4
                            )
                                return;

                            if (
                                xhr.status == 200
                            ) {

                                document.getElementById(
                                    "message"
                                ).value = "";

                                refreshChat();
                            }
                        };
                }
            );

            /*
             * The new server gets the username from
             * the session, so "name" isn't needed.
             *
             * NOTE: this means Anonymous mode is not
             * implemented server-side yet.
             */
            xhr2.send(JSON.stringify({

                text: msg,
                anonymous: document.getElementById("anon").checked
            }));
        }


        function trimMessage(text) {

            if (text.length > 374)
                text = text.substr(0, 374);

            return text;
        }


        /* ---------- rendering ---------- */

        function escapeHTML(s) {

            s = "" + s;

            s = s.replace(
                /&/g,
                "&amp;"
            );

            s = s.replace(
                /</g,
                "&lt;"
            );

            s = s.replace(
                />/g,
                "&gt;"
            );

            return s;
        }
        function loadChatProfile(username, callback) {

            if (!username) {
                if (callback)
                    callback(null);

                return;
            }

            /*
             * Anonymous users use the default avatar.
             * Do NOT request /profile for them.
             */
            if (
                username.toLowerCase() == "anonymous" ||
                username.toLowerCase() == "anon"
            ) {

                var anonymousProfile = {
                    username: username,
                    avatar: "/uploads/avatars/fluttershy.webp"
                };

                chatProfiles[username] =
                    anonymousProfile;

                if (callback)
                    callback(anonymousProfile);

                return;
            }

            /* Already cached */
            if (chatProfiles[username]) {

                if (callback)
                    callback(chatProfiles[username]);

                return;
            }

            var xhr = apiRequest(
                "GET",
                "/profile?user=" +
                encodeURIComponent(username),

                function (xhr) {

                    xhr.onreadystatechange =
                        function () {

                            if (
                                xhr.readyState != 4
                            )
                                return;

                            if (
                                xhr.status != 200
                            ) {

                                if (callback)
                                    callback(null);

                                return;
                            }

                            var profile;

                            try {

                                profile =
                                    JSON.parse(
                                        xhr.responseText
                                    );

                            } catch (e) {

                                if (callback)
                                    callback(null);

                                return;
                            }

                            chatProfiles[username] =
                                profile;

                            if (callback)
                                callback(profile);
                        };
                }
            );

            xhr.send();
        }

        function jsStr(s) {

            s = "" + s;

            s = s.replace(
                /\\/g,
                "\\\\"
            );

            s = s.replace(
                /'/g,
                "\\'"
            );

            return escapeHTML(s);
        }



        function bubbleHTML(
            name,
            text,
            isMine,
            showName
        ) {

            var side =
                isMine
                    ? "right"
                    : "left";

            var html =
                "<div class='row " +
                side +
                "'>";

            if (!isMine) {

                var profile =
                    chatProfiles[name];

                var avatarURL = "";

                if (
                    profile &&
                    profile.avatar
                ) {

                    avatarURL =
                        API +
                        profile.avatar;
                }

                /*
                 * Use the actual profile picture.
                 * If they don't have one, fall back
                 * to the old dot.
                 */
                if (avatarURL) {

                    html +=
                        "<button " +
                        "class='profileButton' " +
                        "onclick=\"profilePictureClicked('" +
                        jsStr(name) +
                        "')\">" +

                        "<img " +
                        "src='" +
                        escapeHTML(avatarURL) +
                        "' " +
                        "alt='' " +
                        "class='chatAvatar'>" +

                        "</button>";

                } else {

                    html +=
                        "<button " +
                        "class='profileButton' " +
                        "onclick=\"profilePictureClicked('" +
                        jsStr(name) +
                        "')\">" +
                        "●" +
                        "</button>";
                }
            }

            if (
                !isMine &&
                showName
            ) {

                html +=
                    "<div class='name'>" +
                    escapeHTML(name) +
                    "</div>";
            }

            html +=
                "<span class='bubble " +
                side +
                "'>" +
                escapeHTML(text) +
                "</span>";

            html +=
                "</div>";

            return html;
        }


        /* Only redraw when content changed. */

        function applyThread(rows) {

            var box =
                document.getElementById(
                    "messages"
                );

            /*
             * Make sure we have profiles for every
             * person appearing in the conversation.
             */
            var missing = [];
            var seen = {};

            for (
                var i = 0;
                i < rows.length;
                i++
            ) {

                var username =
                    rows[i].name;

                if (
                    username &&
                    !chatProfiles[username] &&
                    !seen[username]
                ) {

                    missing.push(username);
                    seen[username] = true;
                }
            }

            /*
             * If profiles are missing, load them first.
             * Then redraw the chat.
             */
            if (missing.length > 0) {

                var remaining =
                    missing.length;

                for (
                    var j = 0;
                    j < missing.length;
                    j++
                ) {

                    (function (username) {

                        loadChatProfile(
                            username,
                            function () {

                                remaining--;

                                if (
                                    remaining == 0
                                ) {

                                    /*
                                     * Force a redraw now that
                                     * the profile pictures exist.
                                     */
                                    lastSig = "";

                                    applyThread(
                                        rows
                                    );
                                }
                            }
                        );

                    })(missing[j]);
                }

                /*
                 * Don't render the incomplete version yet.
                 */
                return;
            }

            var sig = "";
            var html = "";

            for (
                var k = 0;
                k < rows.length;
                k++
            ) {

                var r =
                    rows[k];

                html +=
                    bubbleHTML(
                        r.name,
                        r.text,
                        r.mine,
                        r.showName
                    );

                sig +=
                    r.name +
                    "\u0001" +
                    r.text +
                    "\u0002";
            }

            if (
                sig ==
                lastSig
            )
                return;

            var stick =
                (
                    box.scrollHeight -
                    box.scrollTop -
                    box.clientHeight
                ) < 40;

            lastSig =
                sig;

            box.innerHTML =
                html;

            if (stick)
                box.scrollTop =
                    box.scrollHeight;
        }

        function getProfileTextColor(color1, color2) {
            function hexToRGB(hex) {
                hex = String(hex || "").replace("#", "");

                if (hex.length === 3) {
                    hex =
                        hex.charAt(0) + hex.charAt(0) +
                        hex.charAt(1) + hex.charAt(1) +
                        hex.charAt(2) + hex.charAt(2);
                }

                if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
                    return {
                        r: 255,
                        g: 255,
                        b: 255
                    };
                }

                return {
                    r: parseInt(hex.substr(0, 2), 16),
                    g: parseInt(hex.substr(2, 2), 16),
                    b: parseInt(hex.substr(4, 2), 16)
                };
            }

            function luminance(rgb) {
                return (
                    0.299 * rgb.r +
                    0.587 * rgb.g +
                    0.114 * rgb.b
                );
            }

            var c1 = hexToRGB(color1);
            var c2 = hexToRGB(color2);

            var brightness =
                (luminance(c1) + luminance(c2)) / 2;

            /*
             * Dark gradient = white text
             * Light gradient = black text
             */
            if (brightness < 140) {
                return "#fff";
            }

            return "#000";
        }

        function uploadProfileImage(kind) {

            var input;

            var status;

            if (kind == "avatar") {

                input =
                    document.getElementById(
                        "settingAvatarFile"
                    );

                status =
                    document.getElementById(
                        "avatarUploadStatus"
                    );

            } else {

                input =
                    document.getElementById(
                        "settingBannerFile"
                    );

                status =
                    document.getElementById(
                        "bannerUploadStatus"
                    );
            }

            if (!input || !input.files || !input.files.length) {

                alert(
                    "Please choose an image first."
                );

                return;
            }

            var file = input.files[0];

            if (
                file.size >
                100 * 1024 * 1024
            ) {

                alert(
                    "Images must be 100 MB or smaller."
                );

                return;
            }

            status.innerHTML =
                "Uploading...";

            var form =
                new FormData();

            form.append(
                "kind",
                kind
            );

            form.append(
                "file",
                file
            );

            var xhr = new XMLHttpRequest();

            xhr.open(
                "POST",
                API + "/upload",
                true
            );

            xhr.withCredentials = true;

            xhr.onreadystatechange =
                function () {

                    if (
                        xhr.readyState != 4
                    )
                        return;

                    var result = null;

                    try {

                        result =
                            JSON.parse(
                                xhr.responseText
                            );

                    } catch (e) { }

                    if (
                        xhr.status != 200
                    ) {

                        status.innerHTML =
                            result &&
                                result.error
                                ? escapeHTML(
                                    result.error
                                )
                                : "Upload failed.";

                        return;
                    }

                    status.innerHTML =
                        "Uploaded successfully.";

                    input.value = "";

                    /*
                     * Refresh the currently displayed
                     * profile if it is open.
                     */

                    if (
                        viewedProfileUser ==
                        currentUser
                    ) {

                        openProfile(
                            currentUser
                        );
                    }
                };

            xhr.onerror =
                function () {

                    status.innerHTML =
                        "Upload failed.";
                };

            xhr.send(form);
        }

            var now =

            * Don't send typing requests more than

            lastTypingSent = now;

            var xhr = apiRequest(
                "POST",
                "/typing",
                function (xhr) {

                    xhr.setRequestHeader(
                        "Content-Type",
                        "application/json"

                    xhr.onreadystatechange =

                            if (

                                return;
                            }

                        };
                }
            );

            xhr.send(
                JSON.stringify({
                    conversation:

                })
            );
        }

        /* Restore a valid server session so returning users see their chats. */
        function restoreSession() {
            if (!window.XMLHttpRequest) {
                document.getElementById("login").innerHTML =
                    "<h2>Browser not supported</h2><p>This browser needs XMLHttpRequest support. Very old devices may also need a local HTTP connection because they cannot use modern HTTPS.</p>";
                return;
            }

            var xhr = apiRequest("GET", "/me", function (xhr) {
                xhr.onreadystatechange = function () {
                    if (xhr.readyState != 4) return;
                    if (xhr.status != 200) {
                        showLogin();
                        return;
                    }

                    var profile;
                    try { profile = JSON.parse(xhr.responseText); }
                    catch (e) { showLogin(); return; }

                    currentUser = profile.username;

                    notifiedDMs = {};
                    notificationHistoryLoaded = false;
                    notificationInitialScan = false;

                    active = {
                        type: "public"
                    };

                    lastSig = "";

                    document.getElementById("login").style.display = "none";
                    document.getElementById("register").style.display = "none";
                    document.getElementById("actions").style.display = "inline";
                    document.getElementById("chat").style.display = "block";


                    /* Restore the browser's saved theme. */
                    var savedTheme = "light-skeuo";

                    try {
                        savedTheme =
                            localStorage.getItem(THEME_KEY) ||
                            "light-skeuo";
                    } catch (e) { }

                    applyTheme(
                        savedTheme,
                        true
                    );


                    refreshFriends();

                    selectConv(
                        { type: "public" },
                        true
                    );
                };
            });
            xhr.send();
        }

        var quickCSSEditor = null;

        /* ---------------------------------------------------------
