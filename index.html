        --------------------------------------------------------- */

        function createQuickCSSStyle() {

            if (quickCSSStyle) {
                return;
            }

            quickCSSStyle = document.getElementById("quickCSSInjected");

            if (!quickCSSStyle) {

                quickCSSStyle = document.createElement("style");

                quickCSSStyle.id = "quickCSSInjected";

                document.head.appendChild(quickCSSStyle);
            }
        }


        /* ---------------------------------------------------------
        LOAD QUICKCSS
        --------------------------------------------------------- */

        function getQuickCSS() {

            try {
                return localStorage.getItem("quickCSS") || "";
            } catch (e) {
                return "";
            }
        }


        /* ---------------------------------------------------------
        SAVE QUICKCSS
        --------------------------------------------------------- */

        function saveQuickCSS(css) {

            try {
                localStorage.setItem("quickCSS", css);
            } catch (e) {
                console.log("Could not save QuickCSS:", e);
            }
        }


        /* ---------------------------------------------------------
        APPLY QUICKCSS
        --------------------------------------------------------- */

        function applyQuickCSS(css) {

            createQuickCSSStyle();

            quickCSSStyle.textContent = css || "";
        }


        /* ---------------------------------------------------------
        OPEN EDITOR
        --------------------------------------------------------- */

        function openQuickCSS() {

            var windowEl =
                document.getElementById("quickCSSWindow");

            windowEl.className = "open";

            if (quickCSSEditor) {

                quickCSSEditor.layout();

                quickCSSEditor.focus();

                return;
            }

            require.config({
                paths: {
                    vs:
                        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
                }
            });

            require(
                ["vs/editor/editor.main"],
                function() {

                    quickCSSEditor =
                        monaco.editor.create(
                            document.getElementById(
                                "quickCSSEditor"
                            ),
                            {

                                value: getQuickCSS(),

                                language: "css",

                                theme: "vs-dark",

                                automaticLayout: true,

                                minimap: {
                                    enabled: true
                                },

                                wordWrap: "on",

                                fontSize: 13,

                                tabSize: 4,

                                insertSpaces: true,

                                formatOnPaste: true,

                                formatOnType: true,

                                suggestOnTriggerCharacters: true,

                                scrollBeyondLastLine: false

                            }
                        );


                    /* -------------------------------------------------
                    APPLY CHANGES IMMEDIATELY
                    ------------------------------------------------- */

                    quickCSSEditor.onDidChangeModelContent(
                        function() {

                            var css =
                                quickCSSEditor
                                    .getValue();

                            saveQuickCSS(css);

                            applyQuickCSS(css);

                        }
                    );

                    applyQuickCSS(
                        quickCSSEditor.getValue()
                    );

                    quickCSSEditor.focus();
                }
            );
        }


        /* ---------------------------------------------------------
        CLOSE EDITOR
        --------------------------------------------------------- */

        function closeQuickCSS() {

            var windowEl =
                document.getElementById("quickCSSWindow");

            windowEl.className = "";

            if (quickCSSEditor) {
                quickCSSEditor.layout();
            }
        }


        /* ---------------------------------------------------------
        LOAD QUICKCSS ON PAGE START
        --------------------------------------------------------- */

        function initializeQuickCSS() {

            createQuickCSSStyle();

            applyQuickCSS(
                getQuickCSS()
            );
        }


        if (document.readyState === "loading") {

            document.addEventListener(
                "DOMContentLoaded",
                initializeQuickCSS
            );

        } else {

            initializeQuickCSS();

        }

        var savedTheme = null;

        try {
            savedTheme = localStorage.getItem(THEME_KEY);
        } catch (e) { }

        if (!savedTheme) {
            savedTheme = "light-skeuo";
        }

        applyTheme(savedTheme, true);

        

        restoreSession();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
</body>
